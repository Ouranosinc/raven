# conda env create -f environment-docs.yml
name: raven-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.11,<3.12
  - pywps >=4.7.0
  - ipyleaflet
  - ipython >==9.0.0
  - ipywidgets
  - nbsphinx >=0.9.8
  - numpy >=1.25.0
  - pandas >=2.2
  - sphinx >=9.0.0
  - sphinx-autobuild >=2024.4.16
  - sphinx-click
  - sphinx-autodoc-typehints
  - sphinx-codeautolink >=0.16.2
  - sphinx-copybutton >=0.5.2
  - sphinx-rtd-theme >=1.0
